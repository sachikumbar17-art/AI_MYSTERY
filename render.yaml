services:
  - type: web
    name: ai-mystery-room
    runtime: node
    plan: free
    buildCommand: npm --prefix client ci && npm --prefix server ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
